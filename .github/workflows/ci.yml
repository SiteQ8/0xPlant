name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: python -m oxplant policy-check -c config/oxplant.local.yaml
      - run: OXPLANT_SENSOR_TOKEN=ci python -m oxplant policy-check -c config/oxplant.docker.yaml
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t oxplant/lab:ci .
      - run: docker run --rm oxplant/lab:ci python -m oxplant version
