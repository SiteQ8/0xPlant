[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oxplant"
version = "2.0.0"
description = "0xPlant - open source ICS/OT security monitoring, protective conduits and a simulated water treatment plant"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ali AlEnezi"}]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pymodbus>=3.6"]

[project.scripts]
oxplant = "oxplant.__main__:main"
oxplant-plant = "plant.__main__:main"

[tool.setuptools]
packages = ["oxplant", "plant", "modbuslite"]

[tool.setuptools.package-data]
oxplant = ["ui.html", "ui.js"]
plant = ["hmi.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
