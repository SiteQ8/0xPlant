# 0xPlant Water Works - Docker Compose mode (see docker-compose.yml)
time_scale: 60
scan_ms: 250

plcs:
  - name: PLC-001
    program: intake
    listen: 0.0.0.0
    port: 502
    unit: 1
    seed: 11
    sim_host: 0.0.0.0    # fault-injection API on the L1 network only (container has no other interface)
    sim_port: 9000
    identity: {model_name: "vPLC-1200 Intake", application_name: "INTAKE_v1.3", revision: "1.3.2"}
    remotes:
      - {name: PLC-002, host: 10.10.1.11, port: 502}
  - name: PLC-002
    program: treatment
    listen: 0.0.0.0
    port: 502
    unit: 1
    seed: 22
    sim_host: 0.0.0.0
    sim_port: 9000
    identity: {model_name: "vPLC-1200 Treatment", application_name: "TREAT_v2.0", revision: "1.3.2"}
    remotes:
      - {name: PLC-001, host: 10.10.1.10, port: 502}
      - {name: PLC-003, host: 10.10.1.12, port: 502}
  - name: PLC-003
    program: distribution
    listen: 0.0.0.0
    port: 502
    unit: 1
    seed: 33
    sim_host: 0.0.0.0
    sim_port: 9000
    identity: {model_name: "vPLC-1200 Distribution", application_name: "DIST_v1.1", revision: "1.2.9"}
    remotes:
      - {name: PLC-002, host: 10.10.1.11, port: 502}

# The HMI (10.10.3.30) reaches the PLCs only through the 0xPlant conduits on Level 2.
hmi:
  listen: 0.0.0.0
  port: 8080
  poll_ms: 500
  plcs:
    - {name: PLC-001, program: intake,       host: 10.10.3.10, port: 502}
    - {name: PLC-002, program: treatment,    host: 10.10.3.11, port: 502}
    - {name: PLC-003, program: distribution, host: 10.10.3.12, port: 502}
  users:
    # operator / Operator@2025 (setpoints, start/stop, acknowledge) · supervisor / Supervisor@2025 (+ interlock reset, plant sequence)
    - {username: operator,   role: operator,   password_hash: "pbkdf2_sha256$600000$b3hwbGFudC1obWktc2FsdC0wMQ==$6e9b421ad82a578ddc6874067e2e800ba37ef2340e8fb879f02d92f09e683e5e"}
    - {username: supervisor, role: supervisor, password_hash: "pbkdf2_sha256$600000$b3hwbGFudC1obWktc2FsdC0wMg==$d2be80e7b487d0e10f5059109b5ff268d5ab833932e2f7a1e3c52fea874bc5c4"}

# IoT layer: MQTT broker container (10.10.3.50) and sensor fleet container on Level 1 (10.10.1.60)
mqtt:
  listen: 0.0.0.0
  port: 1883
  interval_s: 2
  plcs:
    - {name: PLC-001, host: 10.10.1.10, port: 502}
    - {name: PLC-002, host: 10.10.1.11, port: 502}
    - {name: PLC-003, host: 10.10.1.12, port: 502}
