# 0xPlant Water Works - local mode (everything on loopback, no Docker needed)
#
# Loopback address plan (mirrors the Purdue layout of the Docker lab):
#   127.0.1.x  Level 1  PLCs                (10.10.1.x in Docker)
#   127.0.3.x  Level 2  HMI + 0xPlant conduits (10.10.3.x)
#   127.0.4.x  Level 3  EWS + 0xPlant console  (10.10.4.x)
# PLCs listen on 5020 locally so no root is required.

time_scale: 60        # 1 real second = 60 simulated seconds
scan_ms: 250

plcs:
  - name: PLC-001
    program: intake
    listen: 127.0.1.10
    port: 5020
    unit: 1
    seed: 11
    sim_port: 9001       # testbed fault-injection API (research instrumentation, loopback only)
    identity: {model_name: "vPLC-1200 Intake", application_name: "INTAKE_v1.3", revision: "1.3.2"}
    remotes:
      - {name: PLC-002, host: 127.0.1.11, port: 5020}
  - name: PLC-002
    program: treatment
    listen: 127.0.1.11
    port: 5020
    unit: 1
    seed: 22
    sim_port: 9002
    identity: {model_name: "vPLC-1200 Treatment", application_name: "TREAT_v2.0", revision: "1.3.2"}
    remotes:
      - {name: PLC-001, host: 127.0.1.10, port: 5020}
      - {name: PLC-003, host: 127.0.1.12, port: 5020}
  - name: PLC-003
    program: distribution
    listen: 127.0.1.12
    port: 5020
    unit: 1
    seed: 33
    sim_port: 9003
    identity: {model_name: "vPLC-1200 Distribution", application_name: "DIST_v1.1", revision: "1.2.9"}
    remotes:
      - {name: PLC-002, host: 127.0.1.11, port: 5020}

# The HMI reaches the PLCs only through the 0xPlant conduits (Level 2 face).
hmi:
  listen: 127.0.0.1
  port: 8080
  source_ip: 127.0.3.30
  poll_ms: 500
  plcs:
    - {name: PLC-001, program: intake,       host: 127.0.3.10, port: 5020}
    - {name: PLC-002, program: treatment,    host: 127.0.3.11, port: 5020}
    - {name: PLC-003, program: distribution, host: 127.0.3.12, port: 5020}
  users:
    # operator / Operator@2025 (setpoints, start/stop, acknowledge) · supervisor / Supervisor@2025 (+ interlock reset, plant sequence)
    - {username: operator,   role: operator,   password_hash: "pbkdf2_sha256$600000$b3hwbGFudC1obWktc2FsdC0wMQ==$6e9b421ad82a578ddc6874067e2e800ba37ef2340e8fb879f02d92f09e683e5e"}
    - {username: supervisor, role: supervisor, password_hash: "pbkdf2_sha256$600000$b3hwbGFudC1obWktc2FsdC0wMg==$d2be80e7b487d0e10f5059109b5ff268d5ab833932e2f7a1e3c52fea874bc5c4"}

# Engineering workstation source address (Level 3).
ews_source_ip: 127.0.4.40

# IoT layer: cleartext MQTT broker (Level 2) and a fleet of condition-monitoring sensors (Level 0/1)
mqtt:
  listen: 127.0.3.50
  port: 1883
  iot_source_ip: 127.0.1.60
  interval_s: 2
  plcs:
    - {name: PLC-001, host: 127.0.1.10, port: 5020}
    - {name: PLC-002, host: 127.0.1.11, port: 5020}
    - {name: PLC-003, host: 127.0.1.12, port: 5020}
